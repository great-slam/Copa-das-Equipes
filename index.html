<style>/* ═══════════════════════════════════════════════════════════════

   Design System v2 — UI/UX profissional
═══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Cores */
  --gold:     #C9A84C;
  --gold-lt:  #E8C97A;
  --gold-dk:  #A07830;
  --gold-dim: rgba(201,168,76,.12);
  --bg:       #080808;
  --bg2:      #111111;
  --bg3:      #191919;
  --bg4:      #242424;
  --bg5:      #333333;
  --text:     #F0F0F0;
  --muted:    #7A7A7A;
  --dim:      #4A4A4A;
  --green:    #4ade80;
  --green-dim:rgba(74,222,128,.12);
  --red:      #f87171;
  --red-dim:  rgba(248,113,113,.12);
  --yellow:   #fbbf24;
  --yellow-dim:rgba(251,191,36,.12);
  --blue:     #60a5fa;
  --blue-dim: rgba(96,165,250,.12);
  --orange:   #fb923c;
  --orange-dim:rgba(251,146,60,.12);

  /* Layout */
  --sidebar: 220px;
  --topbar:  56px;
  --radius:  10px;
  --radius-sm: 6px;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
  --shadow:    0 4px 16px rgba(0,0,0,.5);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.6);
}

html, body { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Shell ───────────────────────────────────────────────────── */
.shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

/* ── Top bar ─────────────────────────────────────────────────── */
.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--bg4);
  height: var(--topbar);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0; z-index: 10;
  box-shadow: 0 1px 0 var(--bg4);
}
.topbar-left  { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.logo-wrap {
  display: flex; align-items: center; gap: 10px;
}
.logo-circle {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-dim), rgba(201,168,76,.25));
  border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--gold);
  letter-spacing: .02em; flex-shrink: 0;
  box-shadow: 0 0 12px rgba(201,168,76,.2);
}
.brand-sub  { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); line-height: 1; }
.brand-main { font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--text); }

.menu-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 8px; border-radius: var(--radius-sm);
  display: none; align-items: center; justify-content: center;
  transition: color .15s, background .15s;
}
.menu-btn:hover { background: var(--bg3); color: var(--text); }
.menu-btn svg { display: block; }

/* Modo badge no topbar */
.mode-badge {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  cursor: pointer; border: none;
  transition: all .2s;
  letter-spacing: .02em;
}
.mode-badge.public  { background: var(--bg4); color: var(--muted); }
.mode-badge.admin   { background: rgba(201,168,76,.2); color: var(--gold); border: 1px solid rgba(201,168,76,.4); }
.mode-badge:hover   { opacity: .85; }

/* ── Body / Sidebar ──────────────────────────────────────────── */
.body { display: flex; flex: 1; overflow: hidden; position: relative; }

.sidebar {
  width: var(--sidebar);
  background: var(--bg2);
  border-right: 1px solid var(--bg4);
  padding: 12px 8px;
  display: flex; flex-direction: column; gap: 2px;
  flex-shrink: 0; overflow-y: auto;
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.sidebar-section-title {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .12em; color: var(--dim);
  padding: 12px 10px 4px; margin-top: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer;
  font-size: 13px; color: var(--muted);
  border-radius: var(--radius-sm);
  transition: all .15s;
  user-select: none; white-space: nowrap;
}
.nav-item:hover  { color: var(--text); background: var(--bg3); }
.nav-item.active { color: var(--gold); background: var(--gold-dim); font-weight: 600; }
.nav-item span   { font-size: 13px; }

.sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 19;
  backdrop-filter: blur(2px);
}

/* ── Content ─────────────────────────────────────────────────── */
.content {
  flex: 1; overflow-y: auto;
  padding: 16px;
  -webkit-overflow-scrolling: touch;
}

/* ── Cards ───────────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--bg4);
  border-radius: var(--radius);
}
.card-p { padding: 16px; }
.card-hover { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card-hover:hover { border-color: var(--gold-dk); box-shadow: var(--shadow-sm); }

/* ── Buttons ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  cursor: pointer; border: none;
  transition: all .15s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.btn-gold    { background: var(--gold); color: #000; }
.btn-gold:hover { background: var(--gold-lt); }
.btn-gold:disabled { opacity: .4; cursor: default; }
.btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--bg5); }
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn-danger  { background: transparent; color: var(--muted); border: 1px solid var(--bg5); }
.btn-danger:hover { border-color: var(--red); color: var(--red); }
.btn-sm      { padding: 6px 10px; font-size: 12px; }
.btn-xs      { padding: 4px 8px; font-size: 11px; }

/* ── Forms ───────────────────────────────────────────────────── */
input, select, textarea {
  background: var(--bg3);
  border: 1px solid var(--bg5);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 14px; color: var(--text);
  width: 100%; outline: none;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
  font-family: inherit;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,.12);
}
input::placeholder { color: var(--dim); }
label {
  display: block; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 5px;
}

/* ── Badges ──────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.badge-gold   { background: var(--gold-dim);    color: var(--gold-lt); }
.badge-gray   { background: var(--bg4);          color: var(--muted); }
.badge-yellow { background: var(--yellow-dim);   color: var(--yellow); }
.badge-orange { background: var(--orange-dim);   color: var(--orange); }
.badge-green  { background: var(--green-dim);    color: var(--green); }
.badge-red    { background: var(--red-dim);      color: var(--red); }
.badge-blue   { background: var(--blue-dim);     color: var(--blue); }

/* ── Tables ──────────────────────────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; padding: 10px 12px;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); background: var(--bg3); white-space: nowrap;
}
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--bg4); }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--bg3); }
.tbl-r { text-align: right; }

/* ── Grid ────────────────────────────────────────────────────── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }

/* ── Flex utils ──────────────────────────────────────────────── */
.row   { display: flex; align-items: center; }
.rowsb { display: flex; align-items: center; justify-content: space-between; }
.col   { display: flex; flex-direction: column; }
.gap1 { gap: 4px; } .gap2 { gap: 8px; } .gap3 { gap: 12px; } .gap4 { gap: 16px; }
.f1 { flex: 1; } .fw { flex-wrap: wrap; }
.mt2 { margin-top: 8px; } .mt3 { margin-top: 12px; } .mt4 { margin-top: 16px; }
.mb2 { margin-bottom: 8px; } .mb3 { margin-bottom: 12px; }
.w100 { width: 100%; }

/* ── Typography ──────────────────────────────────────────────── */
.section-title {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .14em;
  color: var(--gold); margin-bottom: 12px;
}
.page-title {
  font-size: 18px; font-weight: 700; color: var(--text);
  margin-bottom: 4px;
}
.page-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

.tgreen { color: var(--green); } .tred { color: var(--red); }
.tyellow { color: var(--yellow); } .tblue { color: var(--blue); }
.torange { color: var(--orange); } .tgold { color: var(--gold); }
.tmuted { color: var(--muted); } .tdim { color: var(--dim); }
.center { text-align: center; } .right { text-align: right; }
.bold { font-weight: 700; } .semi { font-weight: 600; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Misc ────────────────────────────────────────────────────── */
.space > * + *    { margin-top: 12px; }
.space-sm > * + * { margin-top: 8px; }
.divider { border: none; border-top: 1px solid var(--bg4); margin: 12px 0; }
.progress { height: 5px; background: var(--bg5); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width .4s; }

/* ── Modal ───────────────────────────────────────────────────── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100; padding: 0;
}
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--bg4);
  border-radius: 16px 16px 0 0;
  padding: 20px; width: 100%;
  max-width: 520px; max-height: 92vh;
  overflow-y: auto;
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--bg5); border-radius: 2px;
  margin: 0 auto 16px;
}
@media (min-width:600px) {
  .modal-bg   { align-items: center; padding: 16px; }
  .modal-box  { border-radius: 14px; max-height: 88vh; }
  .modal-handle { display: none; }
}

/* ── Alerts ──────────────────────────────────────────────────── */
.alert {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 14px; border-radius: var(--radius-sm);
  font-size: 13px; line-height: 1.5;
}
.alert-warn   { background: var(--yellow-dim); border: 1px solid rgba(251,191,36,.3); color: var(--yellow); }
.alert-info   { background: var(--blue-dim);   border: 1px solid rgba(96,165,250,.3);  color: var(--blue); }
.alert-orange { background: var(--orange-dim); border: 1px solid rgba(251,146,60,.3);  color: var(--orange); }
.alert-green  { background: var(--green-dim);  border: 1px solid rgba(74,222,128,.3);  color: var(--green); }

/* ── Stat cards ──────────────────────────────────────────────── */
.stat-card { background: var(--bg2); border: 1px solid var(--bg4); border-radius: var(--radius); padding: 16px; }
.stat-val   { font-size: 28px; font-weight: 700; line-height: 1; }
.stat-lbl   { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }

/* ── Cat pills ───────────────────────────────────────────────── */
.cat-pills  { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.cat-pill   {
  padding: 7px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--bg4);
  background: var(--bg2); color: var(--muted);
  touch-action: manipulation; transition: all .15s;
}
.cat-pill.active { background: var(--gold); color: #000; border-color: var(--gold); }
.cat-pill:hover:not(.active) { border-color: var(--bg5); color: var(--text); }

/* ── Academia card ───────────────────────────────────────────── */
.acad-header {
  padding: 14px 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: background .15s;
}
.acad-header:active { background: var(--bg3); }

/* ── Bottom nav ──────────────────────────────────────────────── */
.bottom-nav {
  display: none;
  background: var(--bg2);
  border-top: 1px solid var(--bg4);
  padding-bottom: env(safe-area-inset-bottom, 0);
  flex-shrink: 0;
}
.bn-items { display: flex; justify-content: space-around; }
.bn-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 4px; cursor: pointer;
  color: var(--dim); border: none; background: none;
  flex: 1; transition: color .15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.bn-item.active { color: var(--gold); }
.bn-item svg    { display: block; }
.bn-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

/* ── Hero classificação (modo público) ───────────────────────── */
.hero-class {
  background: linear-gradient(135deg, var(--bg2) 0%, rgba(201,168,76,.05) 100%);
  border: 1px solid var(--bg4);
  border-radius: var(--radius);
  padding: 20px 16px;
  margin-bottom: 16px;
}
.podium {
  display: flex; align-items: flex-end; justify-content: center;
  gap: 8px; margin: 16px 0 8px;
}
.podium-item { text-align: center; flex: 1; max-width: 110px; }
.podium-nome { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.podium-bar  {
  border-radius: 6px 6px 0 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700;
}
.podium-pts  { font-size: 10px; color: var(--muted); margin-top: 4px; }

/* ── Resultado card (screenshot) ─────────────────────────────── */
.res-card {
  background: var(--bg2); border: 1px solid var(--bg4);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 10px;
}
.res-card-header {
  background: var(--bg3); border-bottom: 2px solid var(--gold);
  padding: 7px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.res-card-body  { padding: 14px 16px; }
.res-card-footer {
  border-top: 1px solid var(--bg4);
  display: flex;
}
.res-card-footer button {
  flex: 1; background: none; border: none;
  color: var(--muted); cursor: pointer;
  padding: 9px; font-size: 12px; font-weight: 500;
  transition: color .15s;
}
.res-card-footer button:hover { color: var(--text); }
.res-card-footer button + button { border-left: 1px solid var(--bg4); }

/* ── Jogo pendente card ──────────────────────────────────────── */
.jogo-pend {
  background: var(--bg2); border: 1px solid var(--bg4);
  border-radius: var(--radius); padding: 12px 14px;
  margin-bottom: 8px; cursor: pointer;
  transition: border-color .15s;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.jogo-pend:hover { border-color: var(--gold-dk); }
.jogo-pend:active { background: var(--bg3); }

/* ── Rodada separador ────────────────────────────────────────── */
.rodada-sep {
  display: flex; align-items: center; gap: 8px;
  margin: 8px 0 6px;
}
.rodada-sep-label {
  padding: 2px 10px; background: var(--bg4);
  border-radius: 4px; font-size: 10px; font-weight: 700;
  color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
  white-space: nowrap;
}
.rodada-sep-line { flex: 1; height: 1px; background: var(--bg4); }

/* ── Status bar (modo público) ───────────────────────────────── */
.fb-status-bar {
  position: fixed; top: var(--topbar); left: 0; right: 0;
  background: var(--green-dim); border-bottom: 1px solid rgba(74,222,128,.3);
  color: var(--green); font-size: 11px; font-weight: 600;
  text-align: center; padding: 4px;
  z-index: 9; letter-spacing: .04em;
  display: none;
}
.fb-status-bar.visible { display: block; }

/* ── Mobile ──────────────────────────────────────────────────── */
@media (max-width: 767px) {
  .menu-btn    { display: flex; }
  .sidebar     { position: fixed; top: 0; left: 0; height: 100%; z-index: 20; transform: translateX(-100%); padding-top: var(--topbar); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .bottom-nav  { display: block; }
  .content     { padding: 12px; }
  .g4          { grid-template-columns: 1fr 1fr; }
  .hide-mobile { display: none; }
  .tbl th, .tbl td { padding: 8px 8px; font-size: 12px; }
}
@media (max-width: 420px) {
  .g2 { grid-template-columns: 1fr; }
}
